name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The matrix is not ceremony. This skill was authored on Windows and is
    # published for macOS and Linux; it is what catches path-separator bugs
    # before someone else hits them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to SHAs, not floating major tags. This job is the only thing
      # asserting that the grounding gate still reproduces its fixture, so a
      # retagged upstream action could make a broken gate look healthy.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the skill has zero dependencies, and keeping it that
      # way is a feature worth testing for.
      - name: Unit tests (grounding gate)
        run: node --test scripts/merge-review.test.mjs

      # Includes the symlink-containment cases, which skip on Windows because
      # they need privilege there — the ubuntu and macos legs are what actually
      # exercise them.
      - name: Unit tests (supporting scripts)
        run: node --test scripts/tools.test.mjs

      - name: Regression — demo-repo reproduces expected-review.json
        shell: bash
        run: |
          node scripts/merge-review.mjs \
            --repo examples/demo-repo \
            --in examples/slices \
            --out "$RUNNER_TEMP/out"
          node scripts/assert-fixture.mjs "$RUNNER_TEMP/out/review.json" examples/expected-review.json
